<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">生如夏花 - zskfree Project Portal</title>
  <desc id="desc">A minimalist showcase of AI Agents, Windows Tools, Research Automation &amp; Showcase Demos.</desc>
  <style>
    .title-cn { font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "Georgia", serif; font-size: 40px; font-weight: 600; fill: #f0f6fc; }
    .title-en { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 400; fill: #8b949e; letter-spacing: 1.5px; }
    .tagline { font-family: "SF Mono", "JetBrains Mono", monospace; font-size: 12px; fill: #58a6ff; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
    .motto { font-family: "Noto Serif SC", "Source Han Serif SC", serif; font-size: 15px; font-style: italic; fill: #c9d1d9; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #8b949e; line-height: 1.5; }
    .card-tag { font-family: "SF Mono", "JetBrains Mono", monospace; font-size: 12px; fill: #58a6ff; font-weight: 600; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #f0f6fc; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; fill: #f0f6fc; font-weight: 500; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #8b949e; }
    .url-text { font-family: "SF Mono", "JetBrains Mono", monospace; font-size: 13px; fill: #58a6ff; font-weight: 600; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Divider -->
  <line x1="660" y1="0" x2="660" y2="360" stroke="#21262d" stroke-dasharray="4 8" stroke-width="1"/>

  <!-- Left Content Block -->
  <g transform="translate(64, 52)">
    <!-- Tag Badge -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="17" class="tagline">✦ PROJECT PORTAL</text>

    <!-- Main Title -->
    <text x="0" y="72" class="title-cn">生如夏花</text>
    <text x="176" y="72" class="title-en">/ zskfree.github.io</text>

    <!-- Subtitle / Motto -->
    <text x="0" y="112" class="motto">“生如夏花之绚烂，死如秋叶之静美”</text>
    <text x="0" y="140" class="desc-text">聚合 AI 智能体、Windows 效率工具与科研自动化系统。</text>

    <!-- URL Indicator Button -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="246" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="16" y="22" class="url-text">➜ https://280468.xyz</text>
    </g>
  </g>

  <!-- Right Spotlight Card (Stage 1 Default View) -->
  <g transform="translate(690, 52)">
    <!-- Main Box -->
    <rect width="450" height="250" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>

    <!-- Indicator Light & Stage Header -->
    <circle cx="24" cy="28" r="5" fill="#58a6ff"/>
    <text x="38" y="32" class="card-tag">01 / 04 · FEATURED SPOTLIGHT</text>
    <text x="24" y="60" class="card-title">AI 智能体与聚合引擎</text>
    <line x1="24" y1="82" x2="426" y2="82" stroke="#21262d" stroke-width="1"/>

    <!-- Items -->
    <!-- Item 1 -->
    <g transform="translate(24, 96)">
      <rect x="0" y="5" width="6" height="6" fill="#58a6ff"/>
      <text x="16" y="0" class="item-title">Tech News Purifier</text>
      <text x="16" y="20" class="item-desc">AI 科技新闻净化与 20 分钟播客引擎</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 140)">
      <rect x="0" y="5" width="6" height="6" fill="#58a6ff"/>
      <text x="16" y="0" class="item-title">News-Agent</text>
      <text x="16" y="20" class="item-desc">AI 新闻聚合与 RSS 情报看板</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(24, 184)">
      <rect x="0" y="5" width="6" height="6" fill="#58a6ff"/>
      <text x="16" y="0" class="item-title">ScholarFlow</text>
      <text x="16" y="20" class="item-desc">AI 文献综述自动化与多模型摘要</text>
    </g>

    <!-- Progress Indicator Dots -->
    <g transform="translate(20, 232)">
      <rect x="0" y="0" width="96" height="4" rx="2" fill="#58a6ff"/>
      <rect x="104" y="0" width="96" height="4" rx="2" fill="#30363d"/>
      <rect x="208" y="0" width="96" height="4" rx="2" fill="#30363d"/>
      <rect x="312" y="0" width="96" height="4" rx="2" fill="#30363d"/>
    </g>
  </g>
</svg>
